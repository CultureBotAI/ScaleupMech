name: Mech template candidate
on:
  pull_request: {}
  push: {}
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  template-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
      - name: Install just
        run: uv tool install rust-just==1.46.0
      - name: Validate template candidate and native workflow bindings
        run: just check-template
