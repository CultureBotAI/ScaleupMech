name: Strict validation
on:
  pull_request: {}
  push: {}
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
      - name: Install just
        run: uv tool install rust-just==1.46.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify immutable review event boundary
        run: just check-review-event-base
      - name: Native checks
        run: just check
      - name: Canonical governance
        run: just check-vendored
